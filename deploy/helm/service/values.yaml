name: olist-service
replicaCount: 1

image:
  repository: olist/service
  tag: "0.1.0"
  pullPolicy: IfNotPresent

containerPort: 8080
service:
  enabled: true
  type: ClusterIP
  port: 80

health:
  enabled: true
  livenessPath: /actuator/health/liveness
  readinessPath: /actuator/health/readiness
  initialDelaySeconds: 20

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 768Mi

env: []
command: []
args: []

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

queueAutoscaling:
  enabled: false
  minReplicas: 0
  maxReplicas: 20
  serverAddress: http://prometheus-operated.monitoring.svc:9090
  metricName: temporal_worker_queue_backlog
  threshold: "10"
  query: sum(temporal_worker_queue_backlog)
