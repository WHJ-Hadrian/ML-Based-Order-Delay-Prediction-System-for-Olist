spring:
  application:
    name: analytics-query-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/olist_analytics?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:olist}
    password: ${SPRING_DATASOURCE_PASSWORD:local-only-change-me}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/olist}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/olist/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

olist:
  dataset-service:
    url: ${DATASET_SERVICE_URL:http://localhost:8082}
  clickhouse:
    url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123}
    database: ${CLICKHOUSE_DATABASE:olist_datasets}
    username: ${CLICKHOUSE_USER:olist}
    password: ${CLICKHOUSE_PASSWORD:local-clickhouse-only}
  report-service:
    url: ${REPORT_SERVICE_URL:http://localhost:8090}
    token: ${MODEL_TRAINING_INTERNAL_TOKEN:local-training-token-2026}
  analytics:
    max-rows: ${ANALYTICS_MAX_ROWS:5000}
    default-limit: ${ANALYTICS_DEFAULT_LIMIT:500}
    max-dimensions: 3
    max-metrics: 40
    query-timeout-seconds: ${ANALYTICS_QUERY_TIMEOUT:30}
