spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/olist}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/olist/protocol/openid-connect/certs}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: orders
              uri: ${ORDER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/orders/**
            - id: datasets
              uri: ${DATASET_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/datasets,/api/v1/datasets/**
            - id: jobs
              uri: ${JOB_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/jobs/**
            - id: predictions
              uri: ${PREDICTION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/predictions/**
            - id: models
              uri: ${MODEL_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/models/**
            - id: analytics
              uri: ${ANALYTICS_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/analytics/**

server:
  port: ${SERVER_PORT:8080}

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Authenticated edge gateway for the Olist platform
