# 连接真实 MySQL + ClickHouse：SPRING_DATASOURCE_*、CLICKHOUSE_* 可用环境变量覆盖。
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/olist_datasets?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:olist}
    password: ${SPRING_DATASOURCE_PASSWORD:local-only-change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver

olist:
  model-training:
    internal-token: ${MODEL_TRAINING_INTERNAL_TOKEN:local-training-token-2026}
  clickhouse:
    enabled: ${CLICKHOUSE_ENABLED:true}
    url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123}
    database: ${CLICKHOUSE_DATABASE:olist_datasets}
    username: ${CLICKHOUSE_USER:olist}
    password: ${CLICKHOUSE_PASSWORD:local-clickhouse-only}
  storage:
    type: local
    local-root: ${OLIST_STORAGE_LOCAL_ROOT:${user.home}/.olist/datasets-storage}