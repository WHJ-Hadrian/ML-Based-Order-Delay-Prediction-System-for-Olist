[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-analytics-platform"
version = "0.1.0"
description = "Python model serving and analytics workers for the Olist platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "prometheus-client>=0.21,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
workers = [
    "boto3>=1.35,<2.0",
    "httpx>=0.28,<1.0",
    "temporalio>=1.9,<2.0",
]
analytics = [
    "pandas>=2.2,<3.0",
    "pyarrow>=18,<25",
    "pyspark>=3.5,<5.0",
]
features = [
    "feast[redis]>=0.50,<1.0",
]
ml = [
    "mlflow>=2.19,<4.0",
    "scikit-learn>=1.6,<2.0",
    "xgboost>=2.1,<4.0",
]
test = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
