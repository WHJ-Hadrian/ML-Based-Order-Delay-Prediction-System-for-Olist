name: olist-platform

services:

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-only-change-me}
      MYSQL_USER: ${MYSQL_USER:-olist}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-only-change-me}
      MYSQL_DATABASE: olist_orders
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:2026.10.2
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 15

  object-store-init:
    image: amazon/aws-cli:2
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -e;
        for bucket in olist-artifacts olist-lakehouse; do
          if ! aws --endpoint-url http://localstack:4566 s3api head-bucket --bucket "$$bucket" >/dev/null 2>&1; then
            aws --endpoint-url http://localstack:4566 s3api create-bucket --bucket "$$bucket";
          fi;
        done
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: us-east-1
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:26.10.2
    environment:
      CLICKHOUSE_DB: olist_analytics
      CLICKHOUSE_USER: olist
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-clickhouse-only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB: mysql8
      DB_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-olist}
      MYSQL_PWD: ${MYSQL_PASSWORD:-local-only-change-me}
      MYSQL_SEEDS: mysql
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.57.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8233:8080"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    depends_on:
      mysql:
        condition: service_healthy
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak?useSSL=false&allowPublicKeyRetrieval=true
      KC_DB_USERNAME: ${MYSQL_USER:-olist}
      KC_DB_PASSWORD: ${MYSQL_PASSWORD:-local-only-change-me}
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-change-me}
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak/olist-realm.json:/opt/keycloak/data/import/olist-realm.json:ro

  mlflow:
    profiles: ["ml", "apps"]
    build:
      context: ./infra/mlflow
    depends_on:
      mysql:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - mysql+pymysql://${MYSQL_USER:-olist}:${MYSQL_PASSWORD:-local-only-change-me}@mysql:3306/mlflow
      - --serve-artifacts
      - --artifacts-destination
      - s3://olist-artifacts/mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "5000:5000"

  spark-master:
    profiles: ["batch"]
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "7077:7077"
      - "8088:8080"

  spark-worker:
    profiles: ["batch"]
    image: apache/spark:4.1.3-scala2.13-java17-python3-ubuntu
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g

  flink-jobmanager:
    profiles: ["stream"]
    image: flink:2.3.0-scala_2.12-java17
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    ports:
      - "8089:8081"

  flink-taskmanager:
    profiles: ["stream"]
    image: flink:2.3.0-scala_2.12-java17
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"

  api-gateway:
    profiles: ["apps"]
    build:
      context: ./ML-Based-Order-Delay-Prediction-System-for-Olist-java-backend
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: api-gateway
    environment:
      SERVER_PORT: 8080
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/olist
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/olist/protocol/openid-connect/certs
      ORDER_SERVICE_URL: http://order-service:8081
      DATASET_SERVICE_URL: http://dataset-service:8082
      JOB_SERVICE_URL: http://job-service:8083
      PREDICTION_SERVICE_URL: http://prediction-service:8084
      MODEL_SERVICE_URL: http://model-management-service:8085
      ANALYTICS_SERVICE_URL: http://analytics-query-service:8086
    ports:
      - "8080:8080"

  order-service:
    profiles: ["apps"]
    build:
      context: ./ML-Based-Order-Delay-Prediction-System-for-Olist-java-backend
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: order-service
    environment: &java-service-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/olist_orders?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-olist}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-local-only-change-me}
      SPRING_DATASOURCE_DRIVER: com.mysql.cj.jdbc.Driver
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/olist
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/olist/protocol/openid-connect/certs
    depends_on:
      mysql:
        condition: service_healthy

  dataset-service:
    profiles: ["apps"]
    build:
      context: ./ML-Based-Order-Delay-Prediction-System-for-Olist-java-backend
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: dataset-service
    environment:
      <<: *java-service-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/olist_datasets?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SERVER_PORT: 8082
      OLIST_STORAGE_TYPE: s3
      OLIST_STORAGE_S3_ENDPOINT: http://localstack:4566
      OLIST_STORAGE_S3_BUCKET: olist-artifacts
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      mysql:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully

  job-service:
    profiles: ["apps"]
    build:
      context: ./ML-Based-Order-Delay-Prediction-System-for-Olist-java-backend
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: job-service
    environment:
      <<: *java-service-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/olist_jobs?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SERVER_PORT: 8083
      TEMPORAL_TARGET: temporal:7233
      TEMPORAL_NAMESPACE: default
    depends_on:
      mysql:
        condition: service_healthy
      temporal:
        condition: service_started

  prediction-service:
    profiles: ["apps"]
    build:
      context: ./ML-Based-Order-Delay-Prediction-System-for-Olist-java-backend
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: prediction-service
    environment:
      <<: *java-service-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/olist_predictions?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SERVER_PORT: 8084
    depends_on:
      mysql:
        condition: service_healthy

  model-management-service:
    profiles: ["apps"]
    build:
      context: ./ML-Based-Order-Delay-Prediction-System-for-Olist-java-backend
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: model-management-service
    environment:
      <<: *java-service-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/olist_models?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SERVER_PORT: 8085
    depends_on:
      mysql:
        condition: service_healthy

  analytics-query-service:
    profiles: ["apps"]
    build:
      context: ./ML-Based-Order-Delay-Prediction-System-for-Olist-java-backend
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: analytics-query-service
    environment:
      <<: *java-service-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/olist_analytics?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SERVER_PORT: 8086
    depends_on:
      mysql:
        condition: service_healthy

  model-serving:
    profiles: ["apps"]
    build:
      context: ./ML-Based-Order-Delay-Prediction-System-for-Olist-backend
      dockerfile: Dockerfile
    environment:
      OLIST_MLFLOW_TRACKING_URI: http://mlflow:5000
      OLIST_OBJECT_STORE_ENDPOINT: http://localstack:4566
      OLIST_OBJECT_STORE_BUCKET: olist-artifacts
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "8090:8090"
    depends_on:
      object-store-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_started

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-change-me}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning/datasources/prometheus.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro

volumes:
  mysql-data:
  kafka-data:
  redis-data:
  localstack-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
