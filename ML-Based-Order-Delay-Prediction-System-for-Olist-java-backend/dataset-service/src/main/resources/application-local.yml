# 本地单独运行 profile：跳过 Keycloak，使用 H2 文件库和本地磁盘存储。
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  datasource:
    url: jdbc:h2:file:./data/db/olist_datasets;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

olist:
  storage:
    type: local
    local-root: ./data/datasets
  clickhouse:
    enabled: ${CLICKHOUSE_ENABLED:true}
    url: ${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123?compress=0}
    database: ${CLICKHOUSE_DATABASE:olist_datasets}
    username: ${CLICKHOUSE_USER:olist}
    password: ${CLICKHOUSE_PASSWORD:local-clickhouse-only}

server:
  address: 127.0.0.1
