  module7:{html:pageTemplates.module7,name:'模块七：系统管理'}
};

// 导航切换 iframe 页面渲染
const $ = s=>document.querySelector(s);
const $$ = s=>document.querySelectorAll(s);
const iframe = $('#pageIframe');
const breadName = $('#breadName');

function renderPage(key){
  const cfg = pageMap[key];
  breadName.innerText = cfg.name;
  $$('.sidebar nav a').forEach(a=>a.classList.remove('active'));
  $(`[data-page="${key}"]`).classList.add('active');

  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(cfg.html);
  doc.close();
}

// 默认打开模块一
renderPage('module1');

// 导航点击事件
$$('.sidebar nav a').forEach(a=>{
  a.onclick = ()=>{
    renderPage(a.dataset.page);
  }
})
</script>
