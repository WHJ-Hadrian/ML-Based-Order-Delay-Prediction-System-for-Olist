# 连接真实 MySQL：SPRING_DATASOURCE_* 可用环境变量覆盖。
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/olist_datasets?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:olist}
    password: ${SPRING_DATASOURCE_PASSWORD:local-only-change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver

olist:
  storage:
    type: local
    local-root: ./data/datasets
